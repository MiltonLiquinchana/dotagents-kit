# Configuración base del gateway __NOMBRE__. Sin base de datos ni secret de base.
spring:
  profiles:
    active: <backend.perfil_local>
# si integraciones.autenticacion=clerk
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: <integraciones.clerk_issuer_uri>
# fin
  cloud:
# si devops.infraestructura=jenkins-kubernetes
    gateway:
      server:
        webflux:
          trusted-proxies: '^(?:10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|(?i:fc|fd)[0-9a-fA-F]{2}:[0-9a-fA-F:]+)$'
    kubernetes:
      discovery:
        enabled: true
        all-namespaces: false
        include-not-ready-addresses: false
# si devops.infraestructura=ninguna
    gateway: {}
# fin
logging:
  file:
    name: logs/app.log
    path: logs
# si devops.infraestructura=jenkins-kubernetes

gateway:
  cors-origenes:
    - <backend.cors_origenes>
# fin
