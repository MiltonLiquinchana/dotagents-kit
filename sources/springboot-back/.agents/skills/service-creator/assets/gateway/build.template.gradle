// ==============================================================================
// Build del gateway: sin base de datos; dependencias según la configuración.
// __VERSION_DEP_MANAGEMENT__ y __VERSION_SONARQUBE__ se copian de un servicio.
// __BOM_CLOUD__ llega del plan con fuente y compatibilidad Boot comprobada;
// cualquier valor provisional debe identificarse y tener comprobación pendiente.
// si devops.infraestructura=jenkins-kubernetes
// __VERSION_GRPC__ corresponde al grpc-api resuelto por el cliente de Kubernetes,
// con fuente en el plan o aprobación provisional y comprobación en pruebas.
// si devops.infraestructura=ninguna
// Esta variante no usa grpc-netty.
// fin
// ==============================================================================
plugins {
    id 'java'
    id 'org.springframework.boot' version '<backend.spring_boot>'
    id 'io.spring.dependency-management' version '__VERSION_DEP_MANAGEMENT__'
    id("org.sonarqube") version '__VERSION_SONARQUBE__'
}

group = '__GROUP__'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(<backend.java>)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "__BOM_CLOUD__")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
// si integraciones.autenticacion=clerk
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
// fin
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
// si devops.infraestructura=jenkins-kubernetes
    implementation('org.springframework.cloud:spring-cloud-starter-kubernetes-client-all')
    // lo exige el soporte gRPC opcional de Spring Cloud Gateway, porque el cliente de Kubernetes trae grpc-api al classpath
    implementation 'io.grpc:grpc-netty:__VERSION_GRPC__'
// fin
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
// si integraciones.autenticacion=clerk
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
// fin
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
