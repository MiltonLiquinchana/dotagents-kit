# Catálogo único; valores de filas en JSON (subconjunto YAML).
version: 1
workflows:
  implement-microservice-feature: {"grupo": "E", "resuelve": ["STACK_CODIGO", "DEVOPS_ESTADO", "DEVOPS_VALORES"], "alcance": "servicios_del_plan"}
  incorporate-service: {"grupo": "E", "resuelve": ["STACK_CODIGO", "DEVOPS_ESTADO", "DEVOPS_VALORES"], "alcance": "servicios_del_plan"}
  change-version: {"grupo": "V", "resuelve": ["VERSIONES", "DOCUMENTACION"], "alcance": "versiones_cambiadas"}
# si integraciones.autenticacion=clerk
  add-authentication: {"grupo": "E", "resuelve": ["STACK_CODIGO", "DEVOPS_ESTADO", "DEVOPS_VALORES", "AUTENTICACION"], "alcance": "servicios_del_plan"}
# fin
# si integraciones.gestion_usuarios=organizaciones|aplicacion
  add-user-management: {"grupo": "E", "resuelve": ["STACK_CODIGO", "DEVOPS_ESTADO", "DEVOPS_VALORES", "GESTION_USUARIOS"], "alcance": "servicios_del_plan"}
# fin
  preparar-documentacion: {"grupo": "D", "resuelve": ["DOCUMENTACION", "DOCUMENTACION_GENERAL"], "alcance": "servicios_del_plan"}
codigos:
  REPOSITORIO: {"remedio": "Usuario: ejecuta el workflow desde un repositorio git accesible y con una base de commits.", "corta": "global", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  HERRAMIENTA: {"remedio": "Usuario: instala o habilita la herramienta indicada en PATH y repite el workflow.", "corta": "rama", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  STACK_INVALIDO: {"remedio": "Usuario: corrige la clave indicada en .agents/stack.yaml y vuelve a lanzar el workflow; ningún agente edita ese archivo.", "corta": "global", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  PLANTILLA: {"remedio": "Avisa al mantenedor de .agents con la salida literal; no cambies scripts ni código para superar el control.", "corta": "rama", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  REGENERAR: {"remedio": "Usuario: regenera tú con {comando} y vuelve a lanzar el workflow.", "corta": "global", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  PREPARACION: {"remedio": "Propón bash .agents/scripts/preparar-proyecto.sh; ejecútalo solo con permiso del usuario y repite el preflight. Si una línea de la salida empieza por `Usuario:`, muéstrala literal y detente: esa acción y su commit son del usuario; no repitas el script por ella.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  ARBOL_SUCIO: {"remedio": "Usuario: revisa tus cambios, haz commit y vuelve a lanzar el workflow; no ocultes ni descartes cambios.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "bloqueo"}}
  DOCUMENTACION: {"remedio": "En preparar-documentacion y change-version, sigue su paso de documentación con aprobación explícita del usuario. En cualquier otro workflow, detente y propón al usuario lanzar .agents/workflows/preparar-documentacion.md con las tecnologías y versiones del diagnóstico; desde ese otro workflow no cargues, asocies ni resuelvas versiones, ni edites el registro. Si el preflight muestra «lanza preparar-documentacion», fuera de esos workflows entiéndelo como una propuesta al usuario, no como una acción a ejecutar.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "plan", "V_cierre": "plan", "D_entrada": "plan", "D_cierre": "bloqueo"}}
  DOCUMENTACION_GENERAL: {"remedio": "En preparar-documentacion, sigue su paso para reparar el registro o catálogo indicado sin borrar su historial, con aprobación explícita del usuario. En cualquier otro workflow, detente y propón al usuario lanzar .agents/workflows/preparar-documentacion.md para reparar el registro o catálogo indicado sin borrar su historial; desde ese otro workflow no cargues, asocies ni resuelvas versiones, ni edites el registro. Si el preflight muestra «lanza preparar-documentacion», fuera de ese workflow entiéndelo como una propuesta al usuario, no como una acción a ejecutar.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "plan", "D_cierre": "bloqueo"}}
  OPEN_NOTEBOOK: {"remedio": "Usuario: revisa el diagnóstico de conexión de Open Notebook y repite el workflow; no muestres credenciales. Si Open Notebook está arrancado, puede que tu herramienta bloquee la red local; ejecuta el comando fuera de su aislamiento.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "aviso", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
  GRAFO: {"remedio": "Usuario: ejecuta .agents/workflows/graphify.md para generar o reparar el grafo y repite el workflow.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "bloqueo"}}
  TGREP: {"remedio": "Usuario: revisa la preparación de knowledge-base/ y tgrep; repite hasta Indexing: complete, sin fallback a grep/rg.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "bloqueo"}}
  REGISTRO: {"remedio": "Incluye la corrección de la fila indicada de docs/decisiones-stack.md en el plan aprobado; no la dupliques.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}, "remedio_recordatorio": "Respeta la decisión registrada; no requiere corrección de la fila."}
  STACK_CODIGO: {"remedio": "Presenta la diferencia, ofrece --completo y sí / no / para revisión; escribe solo lo aprobado en el plan.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}}
  PERFILES: {"remedio": "Presenta los perfiles que faltan, ofrece --completo y sí / no / para revisión; escribe solo lo aprobado en docs/decisiones-stack.md para los servicios no tocados.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}}
  PERFILES_TOCADO: {"remedio": "Incluye en el plan la creación de los perfiles que faltan del servicio tocado (application.yaml activo en backend.perfil_local y application-<perfil_local>.yaml, más application-<sufijo>.yaml por entorno con Kubernetes; variables solo por nombre) o corrígelo en el cierre.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "plan", "E_cierre": "bloqueo", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}}
  DEVOPS_ESTADO: {"remedio": "Ofrece sí / no / para revisión; con sí, incluye artefactos para todos los servicios y el gateway con devops-engineer en modo generar.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}, "alcance": "todos_los_servicios"}
  DEVOPS_VALORES: {"remedio": "Presenta la diferencia de devops.* y ofrece sí / no / para revisión; con sí, incluye la corrección de los artefactos del proyecto. stack.yaml solo lo edita el usuario. Con slack_canal vacío informa que no habrá avisos, sin proponer regenerar. Si falta CONSTRUIR_TODO, actualiza el pipeline con implement-microservice-feature, con un plan que enumere y apruebe el diff de lógica.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}, "alcance": "proyecto"}
  PLANTILLAS_NUEVAS: {"remedio": "Usuario: regenera tú con {comando} y vuelve a lanzar el workflow.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}}
  GRAFO_AVISO: {"remedio": "Usuario: revisa el grafo vacío, la instalación de graphify o .graphifyignore según el detalle.", "corta": "no", "estricto": "aviso", "clases": {"E_entrada": "aviso", "E_cierre": "aviso", "V_entrada": "aviso", "V_cierre": "aviso", "D_entrada": "aviso", "D_cierre": "aviso"}}
  VERSIONES: {"remedio": "Lanza .agents/workflows/change-version.md y aprueba el plan de alineación; stack.yaml solo lo edita el usuario.", "corta": "no", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "plan", "V_cierre": "plan", "D_entrada": "aviso", "D_cierre": "bloqueo"}}
  SERVICIOS: {"remedio": "Usuario: identifica un servicio con build.gradle y settings.gradle; usa .agents/workflows/incorporate-service.md.", "corta": "global", "estricto": "bloqueo", "clases": {"E_entrada": "bloqueo", "E_cierre": "bloqueo", "V_entrada": "bloqueo", "V_cierre": "bloqueo", "D_entrada": "bloqueo", "D_cierre": "bloqueo"}}
