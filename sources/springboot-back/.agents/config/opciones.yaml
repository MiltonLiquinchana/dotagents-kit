# Valores permitidos de las marcas `si clave=valor` de este .agents. Solo se declaran aquí:
# scripts y skills no deben presuponer otro valor. La validación la hace
# `node .agents/scripts/stack.mjs validate` (clave presente en .agents/stack.yaml y valor en la lista).
backend.persistencia: [jpa, jdbc]
backend.lombok: [true, false]
integraciones.autenticacion: [ninguna, clerk]
devops.infraestructura: [ninguna, jenkins-kubernetes]
integraciones.gestion_usuarios: [ninguna, organizaciones, aplicacion]
