# permisos mínimos para el discovery del gateway; el usuario añade o quita permisos según su clúster
# ==============================================================================
# CONFIGURACIÓN RBAC - DISCOVERY SERVICE ACCOUNT
# Permite el descubrimiento automático de servicios en Kubernetes
# ==============================================================================

# 👤 Service Account utilizado por los clientes del clúster (e.g. Spring Cloud Gateway)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-service-account
  namespace: default
  annotations:
    description: "Service account para servicios que usan Spring Cloud Kubernetes Discovery"

---
# 🔐 ClusterRole: Permisos necesarios a nivel clúster para Service Discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: discovery-cluster-role
  annotations:
    description: "Permisos mínimos para Spring Cloud Kubernetes Discovery"
rules:
# 📋 Permisos sobre servicios (requerido para resolver nombres internos DNS y discoveryClient.getServices())
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]

# 🎯 Permisos sobre endpoints (requerido para mapear peticiones a las IPs de los Pods activos)
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]

# 🏠 Permisos sobre pods (requerido para obtener metadatos y estado de salud de las réplicas)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
# 🔗 ClusterRoleBinding: Asignar permisos del ClusterRole al Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: discovery-cluster-role-binding
  annotations:
    description: "Vincula permisos de discovery al service account"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: discovery-cluster-role
subjects:
- kind: ServiceAccount
  name: discovery-service-account
  namespace: default
