# SECRETO DE AUTENTICACIÓN - TOKEN DE AGENTE JENKINS
# Genera y almacena el token para el ServiceAccount del pipeline de Jenkins
# Kubernetes rellena el token al aplicarlo; con él, el usuario prepara las credenciales
# de Jenkins con los IDs declarados en `devops.entornos.<nombre>.credencial_kubeconfig`.
# El agente nunca lee el token ni el kubeconfig
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: "jenkins"
type: kubernetes.io/service-account-token
