    secretKeyRef:
      name: __BASE__-__ENTORNO__-service-db-secret
      key: CLERK_WEBHOOK_SIGNING_SECRET
# si integraciones.gestion_usuarios=organizaciones
- name: CLERK_DEFAULT_INVITER_USER_ID
