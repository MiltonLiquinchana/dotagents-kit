# si-archivo integraciones.gestion_usuarios=organizaciones|aplicacion
# Rellena los valores en texto plano (sin Base64) y aplícalo a mano antes del primer despliegue con
# `kubectl apply -f <archivo>`; el pipeline no lo aplica y este archivo no se sube al repositorio.
# Si copias valores desde un Secret con `data:` (Base64), decodifícalos o cambia `stringData:` por `data:`.
# Las claves deben llevar el sufijo de este entorno, igual que las `secretKeyRef` de su deployment.
apiVersion: v1
kind: Secret
metadata:
  name: __BASE__-__ENTORNO__-service-db-secret
  namespace: default
  labels:
    app: __BASE__-__ENTORNO__
    environment: __CARPETA_ENTORNO__
type: Opaque
stringData:
  DB_HOST___ENTORNO_MAYUS__: ""
  DB_PORT___ENTORNO_MAYUS__: ""
  DB_NAME___ENTORNO_MAYUS__: ""
  USER_NAME_DB___ENTORNO_MAYUS__: ""
  PASSWORD_DB___ENTORNO_MAYUS__: ""
  CLERK_SECRET_KEY: ""
  CLERK_WEBHOOK_SIGNING_SECRET: ""
# si integraciones.gestion_usuarios=organizaciones
  CLERK_DEFAULT_INVITER_USER_ID: ""
# fin
